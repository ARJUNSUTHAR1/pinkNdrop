<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" aria-labelledby="title desc" role="img">
  <title id="title">newlife logo</title>
  <desc id="desc">Wordmark "newlife" in a thin script style. Replace font-family to match exact font.</desc>

  <!-- Background for preview (remove in production) -->
  <!-- <rect width="100%" height="100%" fill="#fff"/> -->

  <!-- Wordmark -->
  <g transform="translate(0,8)">
    <text
      x="50%"
      y="60"
      text-anchor="middle"
      font-family="'Dancing Script', 'Pacifico', 'Brush Script MT', cursive"
      font-size="64"
      font-weight="400"
      letter-spacing="0.5"
      style="font-style: normal; dominant-baseline: middle;"
      fill="#000000"
      >
      newlife
    </text>

    <!-- optional small baseline flourish under the word -->
    <path d="M120,95 C200,120 340,120 480,95" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.07" />
  </g>
</svg>
